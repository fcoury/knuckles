on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*.yaml"
      - ".github/actions/*/action.yaml"
      - "ergogen/footprints/*.js"
      - "ergogen/config.yaml"
      - "kibot/*"
      - "freerouting/*"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "build.sh"

name: Build
jobs:
  board:
    strategy:
      fail-fast: false
      matrix:
        spacing: ["18.5", "19.5"]
    runs-on: ubuntu-latest
    name: Generate (${{ matrix.spacing }} mm)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Test spacing selection
        if: matrix.spacing == '19.5'
        run: npm test
      - name: Generate unrouted PCBs with Ergogen (definition in package.json)
        run: npm run build -- --spacing ${{ matrix.spacing }}
      - name: Run KiBot to generate images, gerbers for the plates
        uses: ./.github/actions/kibot
        with:
          boards: frontplate backplate controller_overlay
          config: default
      - name: Run KiBot to generate images, gerbers for the unrouted board
        uses: ./.github/actions/kibot
        with:
          boards: knuckles_wireless
          config: default
      - name: Autoroute and validate PCB
        run: ./scripts/autoroute.sh knuckles_wireless
      - name: Run KiBot to generate images, gerbers for the autorouted board
        uses: ./.github/actions/kibot
        with:
          boards: knuckles_wireless_autorouted
          config: boards
      - name: Persist output
        uses: actions/upload-artifact@v4
        with:
          name: knuckles-${{ matrix.spacing }}mm
          path: |
            cases
            ergogen/output/gerbers
            ergogen/output/images
            outlines
            pcbs
